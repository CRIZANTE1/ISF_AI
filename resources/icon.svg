<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo branco -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  
  <!-- Escudo Hexagonal Vermelho -->
  <path d="M512,76 L836,256 L836,768 L512,948 L188,768 L188,256 Z" 
        fill="#FC3D39" 
        stroke="#FC3D39" 
        stroke-width="8"/>
  
  <!-- Design de Circuito Branco (dentro do escudo) -->
  <!-- Linhas horizontais e verticais do circuito -->
  <path d="M330,330 L430,330 M430,330 L480,380 M480,380 L480,480 M480,480 L430,530 M430,530 L330,530" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="15" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <path d="M544,380 L644,380 M644,380 L694,430 M694,430 L694,530 M694,530 L644,580 M644,580 L544,580" 
        fill="none" 
